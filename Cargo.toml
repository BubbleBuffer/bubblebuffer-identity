[workspace]
members = ["crates/bubblebuffer-device-key", "crates/bubblebuffer-link"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/BubbleBuffer/bubblebuffer-identity"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
tempfile = "3"

[workspace.lints.clippy]
all = "warn"
